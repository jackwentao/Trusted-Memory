[project]
name = "trusted-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mem0ai",
    "sentence-transformers>=6.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = '-m "not slow"'
markers = ["slow: requires network access or model credits"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


